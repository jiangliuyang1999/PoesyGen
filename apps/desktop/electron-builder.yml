appId: com.poesygen.desktop
productName: PoesyGen
asar: true

directories:
  output: ../../release/desktop
  buildResources: build

files:
  - dist/**/*
  - package.json

extraResources:
  - from: ../web/dist
    to: web

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal

dmg:
  title: PoesyGen ${version}
  contents:
    - x: 140
      y: 180
    - x: 420
      y: 180
      type: link
      path: /Applications

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PoesyGen
