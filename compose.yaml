services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: poesygen
      POSTGRES_PASSWORD: poesygen
      POSTGRES_USER: poesygen
    ports:
      - '127.0.0.1:5432:5432'
    restart: unless-stopped
    volumes:
      - poesygen-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U poesygen']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '127.0.0.1:6379:6379'
    restart: unless-stopped
    volumes:
      - poesygen-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  poesygen-postgres:
  poesygen-redis:
